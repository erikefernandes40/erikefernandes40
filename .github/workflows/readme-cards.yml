# Gera os cards do github-readme-stats (GitHub Stats + Most Used Languages) com o seu token,
# para incluir contribuições privadas e repositórios da organization, e faz commit em profile/.
# Documentação: https://github.com/stats-organization/github-readme-stats-action
name: README cards

on:
  # Diariamente às 09:00 UTC = 06:00 em São Paulo (o cron do GitHub é sempre em UTC)
  schedule: [{cron: "0 9 * * *"}]
  # Execução manual: gh workflow run readme-cards.yml
  workflow_dispatch:
  # A cada push na main (o push feito pelo próprio job usa o GITHUB_TOKEN e não dispara de novo)
  push: {branches: ["main"]}

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Card "GitHub Stats": estrelas, commits, PRs, issues, reviews, repos em que contribuiu e a nota (rank).
      # role=... inclui os repositórios da organization além dos seus.
      - name: Card de stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true
          options: >-
            username=erikefernandes40&show_icons=true&theme=vision-friendly-dark&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&show=reviews,prs_merged&number_format=long

      # Card "Most Used Languages": linguagens por tamanho de código nos seus repos e nos da organization.
      - name: Card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true
          options: >-
            username=erikefernandes40&layout=compact&langs_count=8&theme=vision-friendly-dark&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza cards do README [skip ci]" || exit 0
          git pull --rebase origin main
          git push
