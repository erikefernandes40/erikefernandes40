# TEMPORÁRIO: diagnostica o acesso do METRICS_TOKEN à organization. Remover após o diagnóstico.
# Imprime só códigos HTTP, contagens e mensagens de erro da API, nunca o token.
name: Diagnóstico METRICS_TOKEN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      ORG: High-Voltage-Equipament
    steps:
      - name: Diagnóstico
        run: |
          api() { curl -sS -o body.json -D headers.txt -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }

          echo "== 1. Identidade e escopos do token"
          code=$(api https://api.github.com/user)
          echo "HTTP $code | login: $(jq -r '.login // .message' body.json)"
          grep -i '^x-oauth-scopes:' headers.txt || echo "(sem header de escopos)"

          echo "== 2. Membership na org"
          code=$(api "https://api.github.com/user/memberships/orgs/$ORG")
          echo "HTTP $code | state: $(jq -r '.state // .message' body.json) | role: $(jq -r '.role // "-"' body.json)"

          echo "== 3. REST: repos privados da org"
          code=$(api "https://api.github.com/orgs/$ORG/repos?type=private&per_page=100")
          if [ "$code" = 200 ]; then echo "HTTP $code | repos privados visíveis: $(jq length body.json)"; else echo "HTTP $code | mensagem: $(jq -r '.message' body.json)"; fi

          echo "== 4. GraphQL: contagens"
          q='{"query":"{ viewer { own: repositories(first:1, ownerAffiliations:[OWNER]){totalCount} all: repositories(first:1, ownerAffiliations:[OWNER,COLLABORATOR,ORGANIZATION_MEMBER], affiliations:[OWNER,COLLABORATOR,ORGANIZATION_MEMBER]){totalCount} } organization(login:\"High-Voltage-Equipament\"){ repositories(first:1){totalCount} } }"}'
          code=$(api -X POST https://api.github.com/graphql -d "$q")
          echo "HTTP $code"
          jq -c '{own: .data.viewer.own.totalCount, all_affiliations: .data.viewer.all.totalCount, org_repos: .data.organization.repositories.totalCount, errors: [.errors[]?.message]}' body.json

      - name: Metrics em modo debug (sem commit)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: erikefernandes40
          filename: diagnostico.svg
          output_action: none
          debug: yes
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator, organization_member
          repositories: 300
          plugin_languages: yes
